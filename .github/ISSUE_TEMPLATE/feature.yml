name: Feature request
description: Suggest a new prop, component or pattern.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the screen or task, not only the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The prop, component or behavior you would like, with a small example if you can.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Any workaround you are using.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched existing issues and discussions.
          required: true
